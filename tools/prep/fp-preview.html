<!doctype html><html><head><style>body{margin:0}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/examples/jsm/":"/node_modules/three/examples/jsm/","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
// Вид от первого лица без игры: ?k=ak74&pose=hip|ads&reload=0.3&ext=x,y,z,tx,ty,tz
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { registerModel } from '/src/core/assets.js';
try {
const q = new URLSearchParams(location.search);
const gl = new GLTFLoader();
for (const n of ['anims', 'char_negs']) registerModel(n, await gl.loadAsync('/assets/models/' + n + '.glb'));
const { ViewModel } = await import('/src/weapons/viewmodel.js');
const { GUN_INFO } = await import('/src/weapons/guns.js');
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb8c2cb);
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromEquirectangular(await new RGBELoader().loadAsync('/assets/hdr/snowy_field.hdr')).texture;
scene.environmentIntensity = 1.15;
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(0.5, 1, 0.8); scene.add(sun);
const fill = new THREE.DirectionalLight(0xe8eef6, 0.9); fill.position.set(-0.6, 0.8, 0.5); scene.add(fill);
const vm = new ViewModel(scene);
const k = q.get('k') || 'ak74';
vm.setKind(k);
const I = GUN_INFO[k];
const pose = q.get('pose') || 'hip';
const a = pose === 'ads' ? 1 : 0;
const pos = new THREE.Vector3(...(a ? I.ads : I.hip));
const quat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.03, 0.05, 0.02)).slerp(new THREE.Quaternion(), a);
const rl = q.get('reload') !== null ? +q.get('reload') : -1;
if (rl >= 0) {
  const ss = (x0, x1, x) => { const t = Math.min(1, Math.max(0, (x - x0) / (x1 - x0))); return t * t * (3 - 2 * t); };
  const tilt = ss(0, 0.1, rl) * (1 - ss(0.86, 1, rl));
  const grip = new THREE.Vector3(...(I.gripR || [0, -0.17, 0.17]));
  const before = grip.clone().applyQuaternion(quat);
  quat.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0.22 * tilt, 0.12 * tilt, -0.62 * tilt)));
  pos.add(before.sub(grip.applyQuaternion(quat)));
  pos.x -= 0.08 * tilt; pos.y += 0.075 * tilt; pos.z += 0.03 * tilt;
}
for (let i = 0; i < 3; i++) vm.update(pos, quat, +(q.get('theta') || 0), true, false, { dt: 1 / 30, shotAge: 9, reload: rl, empty: q.get('empty') === '1', sprint: 0 });
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 72), W / H, 0.01, 50);
const ext = q.get('ext');
if (ext) { const e = ext.split(',').map(Number); cam.position.set(e[0], e[1], e[2]); cam.lookAt(e[3], e[4], e[5]); }
r.render(scene, cam);
const b = vm.arms && vm.arms.rig.b;
const P = (o) => o.getWorldPosition(new THREE.Vector3()).toArray().map((x) => +x.toFixed(3));
window.out = b ? { rArm: P(b.RightArm), rHand: P(b.RightHand), lArm: P(b.LeftArm), lFore: P(b.LeftForeArm), lHand: P(b.LeftHand) } : 'no arms';
} catch (e) { window.out = String(e.stack || e); }
window.done = true;
</script></body></html>
